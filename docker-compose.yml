# SchoolPlatform — base (production-like) stack.
# Dev additions (MinIO, Mailpit, bind mounts, hot reload, localhost ports) live in
# docker-compose.override.yml, which `docker compose` loads automatically.
#
# All secrets come from environment variables (.env, created from .env.example).
# Required variables use ${VAR:?message} so the stack refuses to start without them.
#
# Networks:
#   edge - only nginx; host ports are published here
#   app  - nginx <-> api/portal/website; has egress (payment/SMS/email providers)
#   data - internal only: mysql, redis, api, worker. No published ports in this file.

name: school-platform

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp

x-api-environment: &api-environment
  APP_ENV: ${APP_ENV:-production}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_NAME: ${DB_NAME:-school_platform}
  DB_USER: ${DB_USER:-school_app}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
  DEFAULT_TENANT_SLUG: ${DEFAULT_TENANT_SLUG:-default}
  DEFAULT_TENANT_HOSTS: ${DEFAULT_TENANT_HOSTS:-localhost,portal.localhost,www.localhost}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
  S3_REGION: ${S3_REGION:-ap-south-1}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID must be set in .env}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY must be set in .env}
  S3_BUCKET_PREFIX: ${S3_BUCKET_PREFIX:-school-platform}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-no-reply@example.invalid}
  JWT_SIGNING_KEY_FILE: ${JWT_SIGNING_KEY_FILE:-/run/secrets/jwt_signing_key.pem}
  WEB_CONCURRENCY: ${API_WORKERS:-2}

services:
  mysql:
    image: mysql:8.4.11
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --skip-name-resolve
      - --local-infile=0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in .env}
      MYSQL_DATABASE: ${DB_NAME:-school_platform}
      MYSQL_USER: ${DB_USER:-school_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - data
    healthcheck:
      # MYSQL_PWD keeps the password out of the process arguments.
      test:
        [
          "CMD-SHELL",
          'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping -h 127.0.0.1 -uroot --silent',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  redis:
    image: redis:8.10.2-alpine
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --protected-mode yes
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    volumes:
      - redis-data:/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    # The image entrypoint fixes /data ownership and drops to the redis user.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
      target: runtime
    image: school-platform/api:${IMAGE_TAG:-local}
    environment: *api-environment
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app
      - data
    <<: *hardening
    restart: unless-stopped

  worker:
    build:
      context: ./apps/api
      target: runtime
    image: school-platform/api:${IMAGE_TAG:-local}
    command: ["arq", "app.worker.WorkerSettings"]
    environment: *api-environment
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app
      - data
    healthcheck:
      test: ["CMD", "arq", "--check", "app.worker.WorkerSettings"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    <<: *hardening
    restart: unless-stopped

  portal:
    build:
      context: .
      dockerfile: infra/docker/portal.Dockerfile
      target: runtime
    image: school-platform/portal:${IMAGE_TAG:-local}
    networks:
      - app
    <<: *hardening
    restart: unless-stopped

  website:
    build:
      context: .
      dockerfile: infra/docker/website.Dockerfile
      target: runtime
    image: school-platform/website:${IMAGE_TAG:-local}
    environment:
      API_INTERNAL_URL: http://api:8000
    networks:
      - app
    <<: *hardening
    tmpfs:
      - /tmp
      # Next.js writes its incremental cache here; everything else is read-only.
      - /srv/apps/website/.next/cache
    restart: unless-stopped

  nginx:
    image: nginxinc/nginx-unprivileged:1.30.6-alpine3.24
    ports:
      - "${HTTP_PORT:-80}:8080"
      - "${HTTPS_PORT:-443}:8443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_started
        required: false
      portal:
        condition: service_started
        required: false
      website:
        condition: service_started
        required: false
    networks:
      - edge
      - app
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    <<: *hardening
    restart: unless-stopped

  # One-off operations container (not started by `up`): `docker compose --profile ops run --rm
  # backup /scripts/backup_mysql.sh`. Uses the MySQL image only for its client tools.
  backup:
    image: mysql:8.4.11
    profiles: ["ops"]
    entrypoint: ["bash"]
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in .env}
      DB_NAME: ${DB_NAME:-school_platform}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./infra/scripts:/scripts:ro
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - data
    security_opt:
      - no-new-privileges:true

networks:
  edge: {}
  app: {}
  data:
    internal: true

volumes:
  mysql-data:
  redis-data:
