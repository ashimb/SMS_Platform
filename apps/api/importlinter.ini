# import-linter contracts (ADR-001). Run: uv run lint-imports
# Wildcards: "*" matches exactly one module name, "**" one or more.

[importlinter]
root_packages =
    app
    scripts
include_external_packages = True

[importlinter:contract:core-independent-of-modules]
name = core/, db/ and common/ never import modules/ (or the app/worker entry points)
type = forbidden
source_modules =
    app.core
    app.db
    app.common
forbidden_modules =
    app.modules
    app.main
    app.worker

[importlinter:contract:routers-no-orm]
name = Routers never import repositories or models (any module)
type = forbidden
source_modules =
    app.modules.*.router
forbidden_modules =
    app.modules.*.repository
    app.modules.*.models
    sqlalchemy
allow_indirect_imports = True

[importlinter:contract:services-no-http]
name = Services and repositories never import FastAPI/Starlette
type = forbidden
source_modules =
    app.modules.*.service
    app.modules.*.repository
    app.modules.*.models
forbidden_modules =
    fastapi
    starlette
allow_indirect_imports = True

[importlinter:contract:public-surface-auth]
name = modules.auth imports other modules only through their __init__
type = forbidden
source_modules =
    app.modules.auth
forbidden_modules =
    app.modules.*.router
    app.modules.*.schemas
    app.modules.*.service
    app.modules.*.repository
    app.modules.*.models
    app.modules.*.policies
    app.modules.*.events
    app.modules.*.constants
ignore_imports =
    app.modules.auth -> app.modules.auth.**
    app.modules.auth.** -> app.modules.auth.**
unmatched_ignore_imports_alerting = none
allow_indirect_imports = True

