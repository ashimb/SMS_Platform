# SchoolPlatform edge proxy (runs in nginxinc/nginx-unprivileged as a non-root user).
#
# Ports inside the container: 8080 (HTTP -> HTTPS redirect, health, ACME), 8443 (TLS).
# docker-compose publishes them as 80/443 on the host.
#
# Host routing (domain-agnostic):
#   portal.<domain>  -> portal (SPA)   + /api/  -> api
#   anything else    -> website (Next) + /api/  -> api
# Application-level tenant resolution happens in the API (FRD FR-TEN-003).
#
# Content-Security-Policy: the apps set their own nonce-based CSP (FRD FR-SEC-024). The edge adds
# only a baseline policy (frame-ancestors/base-uri/object-src); browsers enforce every CSP header,
# so the baseline can only tighten, never loosen, the app policy.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Writable paths for the unprivileged image.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65s;

    # ---- Logging: JSON, path only (no query strings, so tokens/OTPs in URLs are never logged).
    log_format json escape=json
        '{"time":"$time_iso8601","request_id":"$request_id","remote_addr":"$remote_addr",'
        '"host":"$host","method":"$request_method","path":"$uri","status":$status,'
        '"bytes":$body_bytes_sent,"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time","user_agent":"$http_user_agent"}';
    access_log /dev/stdout json;

    # ---- Request size and timeouts (uploads go directly to object storage via pre-signed URLs).
    client_max_body_size        1m;
    client_body_buffer_size     64k;
    client_header_timeout       15s;
    client_body_timeout         15s;
    send_timeout                30s;
    large_client_header_buffers 4 16k;

    # ---- Real client IP. Uncomment and set to the load balancer CIDR when one sits in front.
    # set_real_ip_from 10.0.0.0/8;
    # real_ip_header   X-Forwarded-For;
    # real_ip_recursive on;

    # ---- Rate limiting (coarse edge layer; fine-grained limits live in the API, FRD FR-SEC-022).
    limit_req_zone  $binary_remote_addr zone=req_general:10m      rate=30r/s;
    limit_req_zone  $binary_remote_addr zone=req_auth:10m         rate=10r/m;
    limit_req_zone  $binary_remote_addr zone=req_public_forms:10m rate=6r/m;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
    limit_req_status  429;
    limit_conn_status 429;

    # ---- Compression. Brotli requires the ngx_brotli module, which the official image does not
    # ship; use a brotli-enabled image or CDN compression to enable it:
    #   brotli on; brotli_comp_level 5; brotli_types <same as gzip_types>;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/manifest+json image/svg+xml;

    # ---- Upstreams are resolved at request time through Docker DNS, so the edge starts (and
    # serves /healthz) even when an upstream service is not running.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    map $host $frontend_upstream {
        ~^portal\.  http://portal:8080;
        default     http://website:3000;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ---- HTTP: health, ACME challenge, redirect everything else to HTTPS.
    server {
        listen 8080 default_server;
        server_name _;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/acme;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---- HTTPS
    server {
        listen 8443 ssl default_server;
        http2 on;
        server_name _;

        # TLS certificates. Dev: generated by infra/scripts/dev_certs.sh.
        # Prod: mount ACME-issued certificates at the same paths.
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:TLS:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        # Enable with CA-issued certificates (needs the full chain):
        # ssl_stapling on;
        # ssl_stapling_verify on;

        # Security headers. Defined only at server level: any add_header inside a location would
        # stop these from being inherited, so locations must not use add_header.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self), payment=(self), interest-cohort=()" always;
        add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header X-Request-ID $request_id always;

        limit_conn conn_per_ip 50;

        # Proxy defaults. Also server level only, because a proxy_set_header inside a location
        # disables inheritance of all of these.
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Request-ID      $request_id;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Authentication endpoints: strict per-IP limit (login, OTP, password reset).
        location ^~ /api/v1/auth/ {
            limit_req zone=req_auth burst=5 nodelay;
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream;
        }

        # Public forms (admission enquiries, contact).
        location ~ ^/api/public/v1/(enquiries|contact) {
            limit_req zone=req_public_forms burst=3 nodelay;
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream;
        }

        # Provider webhooks (payments, messaging): small body cap (FRD INT-R-04); the API verifies
        # signatures and applies its own per-provider rate limit.
        location ^~ /api/v1/integrations/ {
            client_max_body_size 64k;
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream;
        }

        location /api/ {
            limit_req zone=req_general burst=60 nodelay;
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream;
        }

        # Internal-only endpoints are never exposed at the edge.
        location ^~ /api/internal/ {
            return 404;
        }

        location / {
            limit_req zone=req_general burst=100 nodelay;
            proxy_pass $frontend_upstream;
        }
    }
}
