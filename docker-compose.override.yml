# Development overrides, loaded automatically by `docker compose`.
# Adds MinIO (S3-compatible storage) and Mailpit (SMTP catcher), switches app services to their
# `dev` build targets with bind mounts and hot reload, and exposes service ports on 127.0.0.1 only.
#
# For production-like runs, skip this file explicitly:
#   docker compose -f docker-compose.yml up

services:
  mysql:
    ports:
      - "127.0.0.1:${MYSQL_DEV_PORT:-3306}:3306"

  redis:
    ports:
      - "127.0.0.1:${REDIS_DEV_PORT:-6379}:6379"

  api:
    build:
      target: dev
    image: school-platform/api:dev
    environment:
      APP_ENV: development
      LOG_LEVEL: debug
      S3_ENDPOINT_URL: http://minio:9000
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    volumes:
      - ./apps/api:/app
    ports:
      - "127.0.0.1:${API_DEV_PORT:-8000}:8000"
    depends_on:
      minio:
        condition: service_started
      mailpit:
        condition: service_healthy

  worker:
    build:
      target: dev
    image: school-platform/api:dev
    command: ["arq", "app.worker.WorkerSettings", "--watch", "app"]
    environment:
      APP_ENV: development
      LOG_LEVEL: debug
      S3_ENDPOINT_URL: http://minio:9000
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    volumes:
      - ./apps/api:/app

  portal:
    build:
      target: dev
    image: school-platform/portal:dev
    # Behind the edge proxy the real API is reachable at /api, so MSW mocks stay off here.
    environment:
      VITE_API_MOCKING: "off"
    # Vite writes its dependency cache; the dev container is not read-only.
    read_only: false
    volumes:
      - ./apps/portal:/repo/apps/portal
      - ./packages:/repo/packages
      - /repo/apps/portal/node_modules

  website:
    build:
      target: dev
    image: school-platform/website:dev
    read_only: false
    volumes:
      - ./apps/website:/repo/apps/website
      - ./packages:/repo/packages
      - /repo/apps/website/node_modules
      - /repo/apps/website/.next

  minio:
    # The official minio/minio image is no longer published; pgsty/minio is a community build of
    # the same server (same CLI and MINIO_* variables). Dev only — production uses managed S3.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID must be set in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY must be set in .env}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:${MINIO_API_DEV_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_DEV_PORT:-9001}:9001"
    networks:
      - data
    security_opt:
      - no-new-privileges:true

  mailpit:
    image: axllent/mailpit:v1.31.6
    environment:
      MP_MAX_MESSAGES: "5000"
    ports:
      - "127.0.0.1:${MAILPIT_UI_DEV_PORT:-8025}:8025"
    networks:
      - app
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 15s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

networks:
  # Docker cannot publish ports from containers that are only on an internal network, so the data
  # network is made non-internal in dev. It stays internal in docker-compose.yml.
  data:
    internal: false

volumes:
  minio-data:
